<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f5">
  <meta name="description" content="本地优先、无障碍的中医执业医师刷题系统">
  <title>中医执业医师刷题系统</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=11">
</head>
<body>
  <header class="site-header">
    <h1 id="app-title" tabindex="-1">中医执业医师刷题系统</h1>
  </header>

  <main id="main-content" tabindex="-1">
    <section class="home-actions" aria-label="选择答题模式">
      <details class="home-mode-panel" data-review-panel>
        <summary class="mode-summary" data-review-summary>复习模式</summary>
        <div class="home-mode-content">
          <button class="mode-button" type="button" data-open-review>随机出题</button>
          <details class="subject-panel" data-subject-panel>
            <summary class="category-summary" data-subject-summary>按科目</summary>
            <section class="subject-list-region" data-subject-list tabindex="-1" aria-label="选择科目">
              <ul class="subject-buttons"></ul>
            </section>
          </details>
        </div>
      </details>
      <button class="mode-button" type="button" data-open-exam>考试模式</button>
      <button class="mode-button" type="button" data-open-wrong-book>错题本</button>
    </section>
  </main>

  <dialog id="review-count-dialog" aria-labelledby="review-count-heading">
    <div class="dialog-body">
      <h2 id="review-count-heading" tabindex="-1">选择随机出题题量</h2>
      <div class="quantity-buttons">
        <button type="button" data-review-count="10">10 题</button>
        <button type="button" data-review-count="50">50 题</button>
        <button type="button" data-review-count="100">100 题</button>
        <button type="button" data-show-custom-count>自定义数量</button>
      </div>
      <form id="custom-count-form" class="custom-count" hidden>
        <label id="custom-count-label" for="custom-count">自定义题量，1 到 3492 题</label>
        <input id="custom-count" name="count" type="number" min="1" max="3492" value="10" required>
        <button class="primary" type="submit">开始复习</button>
      </form>
      <button type="button" data-close-review-dialog>取消</button>
    </div>
  </dialog>

  <dialog id="remove-wrong-dialog" aria-labelledby="remove-wrong-heading" aria-describedby="remove-wrong-message">
    <div class="dialog-body">
      <h2 id="remove-wrong-heading" tabindex="-1">确认移出错题本</h2>
      <p id="remove-wrong-message">本题还未在错题本中作对哦，你确定要把它移出错题本吗？</p>
      <div class="actions">
        <button class="primary" type="button" data-confirm-remove-wrong>确定</button>
        <button type="button" data-cancel-remove-wrong>取消</button>
      </div>
    </div>
  </dialog>

  <div id="live-status" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <noscript>
    <section class="card noscript">
      <h2>需要启用 JavaScript</h2>
      <p>本系统使用 JavaScript 在本地保存学习记录。启用后仍可离线使用，不要求登录。</p>
    </section>
  </noscript>
  <script type="module" src="js/app.js?v=21"></script>
</body>
</html>
