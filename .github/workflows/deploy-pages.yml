name: 发布 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v6
      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 运行测试
        run: npm test
      - name: 安装 Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: 启动本地测试服务器
        run: npm start > /tmp/tcm-exam-server.log 2>&1 &
      - name: 等待本地测试服务器
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tcm-exam-server.log
          exit 1
      - name: 运行桌面与移动浏览器冒烟测试
        run: npm run test:browser
      - name: 运行科目题库修订题浏览器回归
        run: npm run test:browser:subject-quality
      - name: 生成静态网页
        run: npm run build:pages
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上传网页文件
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
